<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Six Flags EMS CAD</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #111827;
    color: #f9fafb;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    box-sizing: border-box;
  }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
  p { color: #9ca3af; font-size: 0.9rem; margin: 0 0 2rem; max-width: 320px; }
  a.btn {
    display: block;
    width: 100%;
    max-width: 320px;
    box-sizing: border-box;
    padding: 0.9rem;
    margin-bottom: 0.75rem;
    border-radius: 0.75rem;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  a.primary { background: #16a34a; color: white; }
  a.secondary { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🚑</div>
    <h1>Connection problem</h1>
    <p>Whatever you were trying to reach didn&rsquo;t load &mdash; check your connection, or continue straight into CAD &mdash; dispatch, crew, and display still work even when the rest of the app can&rsquo;t be reached.</p>
    <a class="btn primary" href="https://localhost/index.html">Continue to CAD directly</a>
    <a class="btn secondary" href="https://sfotems.com">Back to the portal</a>
  </div>
</body>
</html>
