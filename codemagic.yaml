workflows:
  ios-release:
    name: EMS Crew iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "2dddf940-2d08-4205-b6bd-e5f94d86b2a4"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "P4Y42BF394"
        BUNDLE_ID: "com.sfotems.crew"
        APPLE_TEAM_ID: "4K6T694JM2"
    cache:
      cache_paths:
        - client/node_modules
    scripts:
      - name: Install dependencies
        script: |
          cd client
          npm ci
      - name: Build web app
        script: |
          cd client
          npm run build
      - name: Capacitor sync iOS
        script: |
          cd client
          npx cap sync ios
      - name: Build and export iOS IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"
          keychain add-certificates

          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          UUID=$(python3 -c "import subprocess,plistlib; data=subprocess.check_output(['security','cms','-D','-i','$PROFILE']); print(plistlib.loads(data)['UUID'])")
          PROFILE_NAME=$(python3 -c "import subprocess,plistlib; data=subprocess.check_output(['security','cms','-D','-i','$PROFILE']); print(plistlib.loads(data)['Name'])")
          CERT=$(security find-identity -v -p codesigning | grep "iPhone Distribution" | head -1 | grep -o '".*"' | tr -d '"')

          xcodebuild \
            -project client/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT" \
            PROVISIONING_PROFILE="$UUID" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID

          cat > /tmp/ExportOptions.plist << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST_EOF

          security unlock-keychain -p "" ~/Library/Keychains/build.keychain 2>/dev/null || true
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
