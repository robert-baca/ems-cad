workflows:
  ios-release:
    name: EMS Crew iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "2dddf940-2d08-4205-b6bd-e5f94d86b2a4"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "P4Y42BF394"
        BUNDLE_ID: "com.sfotems.crew"
    cache:
      cache_paths:
        - client/node_modules
    scripts:
      - name: Install dependencies
        script: |
          cd client
          npm ci
      - name: Build web app
        script: |
          cd client
          npm run build
      - name: Capacitor sync iOS
        script: |
          cd client
          npx cap sync ios
      - name: Set up keychain and code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and sign iOS
        script: |
          xcode-project build-ipa \
            --project client/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
