workflows:
  ios-release:
    name: EMS Crew iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
      groups:
        - Secret
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "2dddf940-2d08-4205-b6bd-e5f94d86b2a4"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "P4Y42BF394"
        BUNDLE_ID: "com.sfotems.crew"
        APPLE_TEAM_ID: "4K6T694JM2"
    cache:
      cache_paths:
        - client/node_modules
    scripts:
      - name: Install dependencies
        script: |
          cd client
          npm ci
      - name: Build web app
        script: |
          cd client
          npm run build
      - name: Capacitor sync iOS
        script: |
          cd client
          npx cap sync ios
      # Signing is set up BEFORE the archive, so Xcode signs the app with
      # App/App.entitlements (aps-environment). The old flow archived unsigned
      # and re-signed at export, which silently dropped that entitlement --
      # iPhones then failed push registration with "no valid aps-environment
      # entitlement string found for application".
      - name: Set up code signing
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 -d > /tmp/key.p8
          echo "$CERT_PRIVATE_KEY_B64" | base64 -d > /tmp/cert_key.pem
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/key.p8 \
            --certificate-key @file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles --project client/ios/App/App.xcodeproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project client/ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
      - name: Check push entitlement made it into the app
        script: |
          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -q build/ios/ipa/*.ipa -d /tmp/ipa_check
          codesign -d --entitlements - /tmp/ipa_check/Payload/*.app 2>/dev/null | tee /tmp/ents.txt
          grep -q "aps-environment" /tmp/ents.txt || { echo "ERROR: aps-environment missing from signed app - push will not work"; exit 1; }
      - name: Upload to App Store Connect
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/key.p8
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
